source = ~/.config/hypr/other/lockscreen.conf

general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(16, 20, 15, 0.55)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/player.sh
    color = $muted
    font_size = 14
    font_family = JetBrains Mono
    position = 40, 175
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = $foreground
    font_size = 64
    font_family = JetBrains Mono
    position = 40, 70
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B' | tr '[:upper:]' '[:lower:]')"
    color = $muted
    font_size = 16
    font_family = JetBrains Mono
    position = 42, 40
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $borders
    inner_color = $background
    font_color = $foreground
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##c2c9bd"></span>
    hide_input = false
    check_color = $accent
    fail_color = rgb(255, 180, 171)
    fail_text = wrong password
    capslock_color = rgb(185, 204, 180)
    position = 0, -70
    halign = center
    valign = center
    rounding = 0
}
