source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 1
    blur_size = 1
    noise = 0
    contrast = 1
    brightness = 0.35
    vibrancy = 0
    vibrancy_darkness = 0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outline
    inner_color = $surface_dim
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <span foreground="##8C805A">password</span>
    hide_input = false
    rounding = 0
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %b %d")"
    color = $secondary
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰜉
    color = $on_surface
    font_size = 36
    font_family = JetBrainsMonoNL Nerd Font, JetBrainsMono Nerd Font, sans-serif
    position = -40, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰐥
    color = $error
    font_size = 36
    font_family = JetBrainsMonoNL Nerd Font, JetBrainsMono Nerd Font, sans-serif
    position = 40, -110
    halign = center
    valign = center
}